name: Generate PDFs and HTML (PDF to releases, HTML to repo)

on:
  push:
    branches: [ main, master ]
    paths:
      - '**/*.md'
      - 'css/**'
      - 'img/**'
      - '.github/workflows/generate-pdf-advanced.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**/*.md'
      - 'css/**'
      - 'img/**'
  workflow_dispatch:
    inputs:
      config_file:
        description: 'Path to configuration file (optional)'
        required: false
        default: 'marp-config.json'

permissions:
  contents: write
  actions: read

jobs:
  load-config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse-config.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse configuration
        id: parse-config
        run: |
          CONFIG_FILE="${{ github.event.inputs.config_file || 'marp-config.json' }}"
          if [ -f "$CONFIG_FILE" ]; then
            echo "Using configuration from $CONFIG_FILE"
            echo "Config file contents:"
            cat "$CONFIG_FILE"

            # Use jq to parse the JSON and extract presentations array
            MATRIX=$(jq -r '.presentations | map({file: .file, theme: .theme, output: .output, allow_local_files: (.allow_local_files // true)}) | @json' "$CONFIG_FILE")
            echo "Parsed matrix: $MATRIX"
            echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          else
            echo "No configuration file found, using defaults"
            # Default matrix with single presentation
            MATRIX='[{"file":"presentation.md","theme":"./css/mylogo.css","output":"presentation.pdf","allow_local_files":true}]'
            echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          fi

  generate-pdfs:
    needs: load-config
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config: ${{ fromJson(needs.load-config.outputs.matrix) }}
      # Run jobs sequentially to avoid Git conflicts
      fail-fast: false
      max-parallel: 1

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Marp CLI
      run: npm install -g @marp-team/marp-cli

    - name: Generate PDF or HTML
      id: generate
      run: |
        # Build marp command with configuration from matrix
        MARP_CMD="marp"

        if [ "${{ matrix.config.theme }}" != "" ]; then
          MARP_CMD="$MARP_CMD --theme=${{ matrix.config.theme }}"
        fi

        if [ "${{ matrix.config.allow_local_files }}" = "true" ]; then
          MARP_CMD="$MARP_CMD --allow-local-files"
        fi

        # Use the output filename from config
        OUTPUT_FILE="${{ matrix.config.output }}"

        # Determine output format based on file extension
        if [[ "$OUTPUT_FILE" == *.html ]]; then
          # Generate HTML
          MARP_CMD="$MARP_CMD --html -o $OUTPUT_FILE ${{ matrix.config.file }}"
          OUTPUT_FORMAT="html"
        elif [[ "$OUTPUT_FILE" == *.pdf ]]; then
          # Generate PDF
          MARP_CMD="$MARP_CMD --pdf -o $OUTPUT_FILE ${{ matrix.config.file }}"
          OUTPUT_FORMAT="pdf"
        else
          # Default to PDF if no extension specified
          OUTPUT_FILE=$(basename "${{ matrix.config.file }}" .md).pdf
          MARP_CMD="$MARP_CMD --pdf -o $OUTPUT_FILE ${{ matrix.config.file }}"
          OUTPUT_FORMAT="pdf"
        fi

        echo "Running: $MARP_CMD"
        echo "Output file: $OUTPUT_FILE"
        echo "Output format: $OUTPUT_FORMAT"
        $MARP_CMD

        # Verify the file was created
        if [ -f "$OUTPUT_FILE" ]; then
          echo "✅ Successfully generated $OUTPUT_FILE"
          ls -la "$OUTPUT_FILE"
        else
          echo "❌ Failed to generate $OUTPUT_FILE"
          exit 1
        fi

        # Store the output filename and format for other steps
        echo "output_file=$OUTPUT_FILE" >> $GITHUB_OUTPUT
        echo "output_format=$OUTPUT_FORMAT" >> $GITHUB_OUTPUT

        # Create a unique identifier for this job
        THEME_NAME=$(basename "${{ matrix.config.theme }}" .css 2>/dev/null || echo "${{ matrix.config.theme }}")
        UNIQUE_ID="${THEME_NAME}-${OUTPUT_FILE}"
        echo "unique_id=$UNIQUE_ID" >> $GITHUB_OUTPUT

    # Only upload PDF files as artifacts
    # HTML files are committed to the repository instead
    - name: Upload artifact (PDF only)
      if: steps.generate.outputs.output_format == 'pdf'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.generate.outputs.output_format }}-${{ steps.generate.outputs.unique_id }}
        path: ${{ steps.generate.outputs.output_file }}
        retention-days: 30

    # Commit files to repository
    # HTML files are always committed to ensure latest version is available
    # PDF files are only committed if there are changes
    - name: Commit files to repository
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        echo "Current working directory: $(pwd)"
        echo "Files in current directory:"
        ls -la

        echo "Generated file: ${{ steps.generate.outputs.output_file }}"
        echo "Output format: ${{ steps.generate.outputs.output_format }}"

        # Check if the file exists
        if [ -f "${{ steps.generate.outputs.output_file }}" ]; then
          echo "✅ File exists: ${{ steps.generate.outputs.output_file }}"
          ls -la "${{ steps.generate.outputs.output_file }}"
        else
          echo "❌ File does not exist: ${{ steps.generate.outputs.output_file }}"
          exit 1
        fi

        # Check if we have changes to commit
        # For HTML files, we always want to commit to ensure the latest version is in the repo
        # For PDF files, we check if there are actual changes
        if [ "${{ steps.generate.outputs.output_format }}" = "html" ]; then
          echo "HTML file - always committing to repository"
        else
          # For PDF files, check if there are changes
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit for PDF"
            exit 0
          fi
        fi

        # Add the generated file
        git add "${{ steps.generate.outputs.output_file }}"

        # Show git status
        git status

        # Commit the changes
        if [ "${{ steps.generate.outputs.output_format }}" = "html" ]; then
          git commit -m "Update HTML presentation from ${{ matrix.config.file }} [skip ci]"
        else
          git commit -m "Auto-generate ${{ steps.generate.outputs.output_format }} from ${{ matrix.config.file }} [skip ci]"
        fi

        # Pull latest changes and rebase our commit on top
        git pull --rebase origin main

        # Push the changes
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Only create GitHub releases for PDF files
    # HTML files are committed to the repository but not released
    - name: Create Release (on push to main/master, PDF only)
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.generate.outputs.output_format == 'pdf'
      uses: softprops/action-gh-release@v1
      with:
        files: ${{ steps.generate.outputs.output_file }}
        tag_name: pdf-${{ matrix.config.file }}-v${{ github.run_number }}
        name: PDF Release - ${{ matrix.config.file }}
        body: |
          Auto-generate PDF from ${{ matrix.config.file }}

          Generated on: ${{ github.event.head_commit.timestamp }}
          Commit: ${{ github.sha }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}