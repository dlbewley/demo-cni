name: Generate Mermaid Diagrams as PNG

on:
  push:
    branches: [ main, master ]
    paths:
      - '**/diagram*.md'
      - '.github/workflows/generate-mermaid-diagrams.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**/diagram*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: |
        npm install -g @mermaid-js/mermaid-cli
        npm install puppeteer

    - name: Find diagram files
      id: find-diagrams
      run: |
        # Find all markdown files starting with "diagram"
        DIAGRAM_FILES=$(find . -name "diagram*.md" -type f)
        echo "Found diagram files:"
        echo "$DIAGRAM_FILES"
        echo "diagram_files<<EOF" >> $GITHUB_OUTPUT
        echo "$DIAGRAM_FILES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Generate PNG diagrams
      run: |
        # Create img directory if it doesn't exist
        mkdir -p img

        # Process each diagram file
        echo "${{ steps.find-diagrams.outputs.diagram_files }}" | while read -r file; do
          if [ -n "$file" ]; then
            echo "Processing: $file"

            # Extract the basename (remove .md extension and path)
            basename=$(basename "$file" .md)
            output_file="img/${basename}.png"

            echo "Generating: $output_file"

            # Generate PNG using mermaid-cli
            # First, extract the mermaid code from the markdown
            mermaid_code=$(awk '/^```mermaid$/,/^```$/' "$file" | grep -v '^```')

            if [ -n "$mermaid_code" ]; then
              echo "$mermaid_code" | mmdc -o "$output_file" -f png

              if [ -f "$output_file" ]; then
                echo "✅ Successfully generated $output_file"
                ls -la "$output_file"
              else
                echo "❌ Failed to generate $output_file"
              fi
            else
              echo "⚠️  No mermaid code found in $file"
            fi
          fi
        done

    - name: Commit generated PNG files
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # Check if we have any PNG files to commit
        if git diff --name-only --cached | grep -q "\.png$" || git ls-files --others --exclude-standard | grep -q "\.png$"; then
          echo "PNG files found, committing changes"

          # Add all PNG files in img directory
          git add img/*.png

          # Show git status
          git status

          # Commit the changes
          git commit -m "Auto-generate Mermaid diagrams as PNG [skip ci]"

          # Push the changes
          git push
        else
          echo "No PNG files to commit"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload PNG artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mermaid-diagrams
        path: img/*.png
        retention-days: 30
