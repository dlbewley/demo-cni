name: Generate Mermaid Diagrams as PNG

on:
  push:
    branches: [ main, master, feature/diagrams ]
    paths:
      - '**/diagram*.md'
      - '.github/workflows/generate-mermaid-diagrams.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**/diagram*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        npm install -g @mermaid-js/mermaid-cli
        npm install puppeteer

    - name: Find diagram files
      id: find-diagrams
      run: |
        # Find all markdown files starting with "diagram"
        DIAGRAM_FILES=$(find . -name "diagram*.md" -type f)
        echo "Found diagram files:"
        echo "$DIAGRAM_FILES"
        echo "diagram_files<<EOF" >> $GITHUB_OUTPUT
        echo "$DIAGRAM_FILES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Generate PNG diagrams
      run: |
        # Create img directory if it doesn't exist
        mkdir -p img

        # Process each diagram file
        echo "${{ steps.find-diagrams.outputs.diagram_files }}" | while read -r file; do
          if [ -n "$file" ]; then
            echo "Processing: $file"

            # Extract the basename (remove .md extension and path)
            basename=$(basename "$file" .md)
            output_file="img/${basename}.png"

            echo "Generating: $output_file"

            # Generate PNG directly from markdown file using mermaid-cli
            mmdc -w 1920 -H 1080 -i "$file" -o "$output_file" -p ".github/workflows/puppeteer-config.json"

            if [ -f "$output_file" ]; then
              echo "✅ Successfully generated $output_file"
              ls -la "$output_file"
            else
              echo "❌ Failed to generate $output_file"
            fi
          fi
        done

    - name: Commit generated PNG files
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # Show current git status
        echo "=== Git status before adding files ==="
        git status

        # Force add all PNG files in img directory (including new ones)
        echo "=== Adding PNG files ==="
        git add -f img/*.png

        # Show what was staged
        echo "=== Staged files ==="
        git diff --cached --name-only

        # Show git status after adding
        echo "=== Git status after adding files ==="
        git status

        # Check if we have staged changes
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          echo "Changes detected, committing..."

          # Commit the changes
          git commit -m "Auto-generate Mermaid diagrams as PNG [skip ci]"

          # Show final status
          echo "=== Final git status ==="
          git status

          # Push the changes
          echo "=== Pushing changes ==="
          git push
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload PNG artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mermaid-diagrams
        path: img/*.png
        retention-days: 30
