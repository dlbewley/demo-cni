name: Generate PDF from Markdown

on:
  push:
    branches: [ main, master ]
    paths:
      - 'presentation.md'
      - 'css/**'
      - 'img/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'presentation.md'
      - 'css/**'
      - 'img/**'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write  # Needed to commit files and create releases
  actions: read    # Needed to upload artifacts

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install Marp CLI
      run: npm install -g @marp-team/marp-cli
      
    - name: Generate PDF
      run: |
        marp --theme=./css/mylogo.css --allow-local-files --pdf presentation.md
        
    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: presentation-pdf
        path: presentation.pdf
        retention-days: 30
        
    - name: Commit PDF to repository
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add presentation.pdf
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-generate PDF from presentation.md [skip ci]"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Create Release (on push to main/master)
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v1
      with:
        files: presentation.pdf
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        body: |
          Auto-generated PDF from presentation.md
          
          Generated on: ${{ github.event.head_commit.timestamp }}
          Commit: ${{ github.sha }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 