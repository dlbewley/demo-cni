apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-vm-localnet-cudn

labels:
- includeSelectors: true
  pairs:
    allow-cudn-1924: "true"

resources:
- namespace.yaml

components:
- ../components/localnet-udn
- ../components/vm

patches:
- patch: |-
    # rename VM
    - op: replace
      path: /metadata/name
      value: vm-localnet-cudn
    - op: add
      path: /spec/template/spec/domain/devices/interfaces/-
      value: {
        "name": "nic-vlan-1924",
        "bridge": {},
        "model": "virtio"
      }
    - op: add
      path: /spec/template/spec/networks/-
      value: {
        "name": "nic-vlan-1924",
        "multus": {
          "networkName": "cudn-1924"
        }
      }
  target:
    group: kubevirt.io
    kind: VirtualMachine
    name: .*
    version: v1